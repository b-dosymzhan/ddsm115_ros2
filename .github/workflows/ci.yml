name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ros2:
    name: Build and test (ROS 2 Humble)
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/ddsm115_ros2

      - name: Install dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y -r \
            --dependency-types build --dependency-types buildtool --dependency-types test

      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build

      - name: Test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

  tools:
    name: ddsm.py (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install pyserial pytest flake8
      - name: Lint
        run: flake8 --max-line-length 99 tools
      - name: Test
        run: python -m pytest tools -q
