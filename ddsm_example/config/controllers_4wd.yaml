controller_manager:
  ros__parameters:
    # Every cycle queries each motor (about 3 ms per motor on the bus);
    # a 4-wheel robot ran at 20 Hz
    update_rate: 20

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_cont:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true

    left_wheel_names: ['front_left_wheel_joint', 'rear_left_wheel_joint']
    right_wheel_names: ['front_right_wheel_joint', 'rear_right_wheel_joint']
    # Measure the wheel radius. For skid-steer (4 wheels) wheel_separation is an effective
    # value, see docs/ros2_control.md for the spin-in-place calibration
    wheel_separation: 0.30
    wheel_radius: 0.05

    cmd_vel_timeout: 0.5   # stop when no command arrives
    use_stamped_vel: false
    open_loop: false

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 2.0
    linear.x.min_acceleration: -2.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0
    angular.z.max_acceleration: 3.0
    angular.z.min_acceleration: -3.0
